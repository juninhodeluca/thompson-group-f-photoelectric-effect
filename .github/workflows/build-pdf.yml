name: Validate paper LaTeX build

on:
  push:
    branches: [main]
    paths:
      - paper.tex
      - .github/workflows/build-pdf.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out manuscript
        uses: actions/checkout@v4

      - name: Install TeX
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            latexmk lmodern poppler-utils texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended

      - name: Typeset and validate PDF
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error paper.tex
          test -s paper.pdf
          pdfinfo paper.pdf | grep -E '^Pages:|^Page size:'

